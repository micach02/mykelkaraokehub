# Builds the web app and publishes it to GitHub Pages on every push to main.
# The karaoke server (YouTube search + phone rooms) runs separately on Render
# (see render.yaml). Its address comes from the repository variable
# API_BASE_URL (Settings → Secrets and variables → Actions → Variables).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Served from https://<user>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.API_BASE_URL || 'https://mykelkaraokehub.onrender.com' }}

      # Pages has no server-side routing: unknown paths (e.g. a phone opening
      # /remote/ABC from the QR code) get 404.html, which is the app itself.
      - name: Single-page app fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
